{% load static %}

<header class="site-header">
    <nav class="nav-bar">

        {% if user.is_authenticated %}

            <span class="nav-user">Signed in as {{ user.username }}</span>
            
            {% if user.is_authenticated %}
                <a href="{{ dashboard_url }}" class="button">Complaints</a>
            {% endif %}


            {% if user.is_authenticated and user.profile.role == "CONSUMER" %}
                 <a class="button" href="{% url 'create_complaint' %}">
                     New Complaint
                 </a>
            {% endif %}


            <form class="nav-logout" action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button class="button" type="submit">Logout</button>
            </form>

        {% endif %}

    </nav>
</header>
